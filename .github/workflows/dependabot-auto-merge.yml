# Auto-merges Dependabot PRs that only touch dev-dependencies at minor/patch level
# (see the "dev-dependencies" / "github-actions" groups in dependabot.yml).
# Production-dependency and major-version updates always require manual review.
name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for dev-dependency minor/patch updates
        if: |
          steps.metadata.outputs.dependency-group == 'dev-dependencies' ||
          steps.metadata.outputs.dependency-group == 'github-actions'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
